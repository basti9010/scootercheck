# ScooterCheck AI Bridge 2.1 — Cursor Cloud Agents LIVE smoke
#
# Manual only (workflow_dispatch). Never push / pull_request / schedule.
# Uses GitHub Environment "production" for CURSOR_API_KEY only.
# Does NOT deploy to Hetzner. Does NOT modify secrets or branch protection.
#
# Residual risk: Cursor POST /v1/agents is not idempotent. This workflow uses
# concurrency + local idempotency_state.json within a run to avoid duplicate
# starts on resume; a hard kill between create and state write can still
# produce a duplicate agent — do not re-run casually.
#
# Owner action after merge: restrict Environment "production" deployment
# branches if not already limited (Settings → Environments → production).

name: AI Bridge Live Smoke (Cursor API)

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Type exactly LIVE to start a real Cursor Cloud Agent (costs API usage)"
        required: true
        type: string
        default: ""
      starting_ref:
        description: "Git startingRef for the agent (branch/tag/SHA Cursor should base on)"
        required: true
        type: string
        default: "cursor/ai-bridge-v2-b100"
      max_polls:
        description: "Max status polls (interval ~10s). Timeout → RESULT_STATUS=UNKNOWN, keeps agent id."
        required: false
        type: string
        default: "60"

concurrency:
  group: ai-bridge-live-smoke-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-smoke:
    name: Cursor live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: services/ai-bridge

    steps:
      - name: Refuse unless confirm_live=LIVE
        if: ${{ inputs.confirm_live != 'LIVE' }}
        run: |
          set -euo pipefail
          echo "Refusing live smoke: confirm_live must be exactly LIVE (got a non-matching value)."
          echo "No Cursor API call was made."
          exit 1

      - name: Checkout (selected workflow branch only)
        uses: actions/checkout@v4

      - name: Assert CURSOR_API_KEY present (value never printed)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          # Do not use set -x. Do not echo the secret.
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is empty in environment production — aborting."
            exit 1
          fi
          # Presence-only check: length without revealing content.
          LEN=$(printf '%s' "$CURSOR_API_KEY" | wc -c | tr -d ' ')
          if [ "$LEN" -lt 8 ]; then
            echo "CURSOR_API_KEY looks too short — aborting."
            exit 1
          fi
          echo "CURSOR_API_KEY present (length redacted)."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-bridge/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline regression (no live key required for these)
        env:
          CURSOR_API_KEY: ""
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_live_smoke_blocked.py tests/test_live_smoke_harness.py tests/test_workflow_live_smoke_security.py

      - name: Start / poll real Cursor agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AI_BRIDGE_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/research/ai-bridge-live-smoke
          AI_BRIDGE_LIVE_STARTING_REF: ${{ inputs.starting_ref }}
          AI_BRIDGE_LIVE_MAX_POLLS: ${{ inputs.max_polls }}
          AI_BRIDGE_LIVE_POLL_INTERVAL_S: "10"
          AI_BRIDGE_LIVE_IDEMPOTENCY_KEY: gha-${{ github.run_id }}-${{ github.run_attempt }}
          AI_BRIDGE_LIVE_REPO_URL: https://github.com/${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never set -x — would risk leaking env in some runners.
          PYTHONPATH=. python -m ai_bridge.run_live_smoke

      - name: Sanitize artifact tree (drop idempotency if empty)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p research/ai-bridge-live-smoke
          # Ensure reports exist for upload even on early failure.
          if [ ! -f research/ai-bridge-live-smoke/LIVE_RESULT.json ]; then
            printf '%s\n' '{"CURSOR_API_LIVE_VERIFIED":false,"note":"no_report_written"}' > research/ai-bridge-live-smoke/LIVE_RESULT.json
          fi
          # Strip any accidental secret-looking lines from markdown (belt-and-suspenders).
          if [ -f research/ai-bridge-live-smoke/LIVE_RESULT.md ]; then
            sed -E 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig; s/(CURSOR_API_KEY[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              research/ai-bridge-live-smoke/LIVE_RESULT.md > research/ai-bridge-live-smoke/LIVE_RESULT.md.tmp
            mv research/ai-bridge-live-smoke/LIVE_RESULT.md.tmp research/ai-bridge-live-smoke/LIVE_RESULT.md
          fi

      - name: Upload live smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scootercheck-cursor-live-smoke
          path: |
            research/ai-bridge-live-smoke/LIVE_RESULT.json
            research/ai-bridge-live-smoke/LIVE_RESULT.md
          retention-days: 7
          if-no-files-found: warn

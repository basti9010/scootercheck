name: Server Firmware Tests

on:
  pull_request:
    paths:
      - "server/firmware-analysis/**"
      - ".github/workflows/server-firmware-tests.yml"
      - ".github/workflows/deploy-hetzner.yml"
  push:
    branches:
      - main
      - master
      - cursor/hetzner-deploy-cd-c12-b100
      - cursor/server-diagnostics-c11-b100
    paths:
      - "server/firmware-analysis/**"
      - ".github/workflows/server-firmware-tests.yml"
  workflow_dispatch:

concurrency:
  group: server-fw-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python unit tests (firmware-analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/firmware-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/firmware-analysis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run mandatory deploy-gate tests
        run: |
          python -m pytest -q \
            test_zip_safe.py \
            test_api_auth_security.py \
            test_path_confinement.py \
            test_diagnostics_routes.py \
            test_diagnostics_tea.py \
            test_diagnostics_ghidra.py \
            test_deploy_smoke_logic.py \
            test_deploy_manifest.py \
            --tb=short

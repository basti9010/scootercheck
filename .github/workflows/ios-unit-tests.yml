# Final release — PR build/unit-test CI (no TestFlight upload / no signing secrets).
# Separates compile+test+PDFKit validation from distribution allowlists.
name: iOS Unit Tests

on:
  pull_request:
    paths:
      - "ios/ScooterCheck/**"
      - ".github/workflows/ios-unit-tests.yml"
  push:
    paths:
      - "ios/ScooterCheck/**"
      - ".github/workflows/ios-unit-tests.yml"
  workflow_dispatch:

concurrency:
  group: ios-unit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ScooterCheck Unit Tests
    runs-on: macos-15
    timeout-minutes: 45
    # No secrets: fork PRs and untrusted branches stay safe.
    defaults:
      run:
        working-directory: ios/ScooterCheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          CANDIDATE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Prepare PDF validation output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-validation/pdf/previews"
          echo "FIRMWARE_PDF_VALIDATION_DIR=$GITHUB_WORKSPACE/release-validation/pdf" >> "$GITHUB_ENV"

      - name: Unit tests (ScooterCheckTests)
        env:
          FIRMWARE_PDF_VALIDATION_DIR: ${{ github.workspace }}/release-validation/pdf
          # Pass through to the iOS Simulator test process (xcodebuild env alone is not enough).
          SIMCTL_CHILD_FIRMWARE_PDF_VALIDATION_DIR: ${{ github.workspace }}/release-validation/pdf
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 17", "iPhone 16", "iPhone 16e", "iPhone SE")
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime and "iPhone" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name") or ""
                  if "iPhone" not in name:
                      continue
                  candidates.append((name, d["udid"], runtime))
          if not candidates:
              sys.exit("no iPhone simulator available")
          for pref in preferred:
              for name, udid, runtime in candidates:
                  if name.startswith(pref):
                      print(udid)
                      print(f"Selected {name} ({runtime}) -> {udid}", file=sys.stderr)
                      raise SystemExit(0)
          name, udid, runtime = candidates[-1]
          print(udid)
          print(f"Selected {name} ({runtime}) -> {udid}", file=sys.stderr)
          ')
          echo "Using simulator UDID=$DEST"
          xcodebuild test \
            -project ScooterCheck.xcodeproj \
            -scheme ScooterCheck \
            -destination "platform=iOS Simulator,id=$DEST" \
            -only-testing:ScooterCheckTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath "$GITHUB_WORKSPACE/release-validation/ScooterCheckTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize PDF validation artifacts
        if: always()
        run: |
          OUT="$GITHUB_WORKSPACE/release-validation/pdf"
          echo "PDF validation dir: $OUT"
          ls -la "$OUT" || true
          ls -la "$OUT/previews" || true
          if [ -f "$OUT/validation-summary.json" ]; then
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("release-validation/pdf/validation-summary.json")
          data = json.loads(p.read_text())
          print("reports:", len(data.get("reports") or []))
          for r in data.get("reports") or []:
              print(f"  - {r.get('name')}: pages={r.get('pageCount')} ok={r.get('ok')} bytes={r.get('byteCount')}")
          PY
          else
            echo "validation-summary.json missing (test may have failed before export)"
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload PDF release-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-release-validation
          path: |
            release-validation/pdf/**
          if-no-files-found: warn
          retention-days: 14

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight-Changelog"
        required: false
        default: "ScooterCheck Diagnose-Build"
  push:
    branches:
      - main
      - master
      - cursor/testflight-ci-133a
      - cursor/dual-tuning-detection-133a
      - cursor/unlock-rescan-prosecutor-b100
      - cursor/back-copyright-b100
      - cursor/ui-redesign-b100
      - cursor/ble-analysis-suite-b100
      - cursor/ble-watch-radar-b100
      - cursor/ble-path-heatmap-b100
      - cursor/app-icon-homescreen-b100
      - cursor/find-hub-nav-b100
      - cursor/signal-finder-soft-heatmap-b100
      - cursor/signal-finder-live-center-b100
      - cursor/faq-finden-hub-b100
      - cursor/menu-edge-swipe-b100
      - cursor/geraete-auslesen-nav-b100
      - cursor/faq-accordion-polish-b100
      - cursor/menu-full-swipe-open-b100
      - cursor/e-scooter-menu-labels-b100
      - cursor/signal-finder-ble-filter-b100
      - cursor/find-subpage-header-b100
      - cursor/ble-list-sort-filter-b100
      - cursor/menu-edge-swipe-fix-b100
      - cursor/ui-proportion-redesign-b100
      - cursor/remove-geraetesuche-hub-b100
      - cursor/faq-list-redesign-b100
      - cursor/signal-finder-no-crosshair-b100
      - cursor/ar-signal-finder-b100
      - cursor/nav-transitions-b100
      - cursor/privacy-faq-parity-b100
      - cursor/map-accurate-location-b100
      - cursor/find-chrome-slide-fix-b100
      - cursor/find-edge-ar-bugs-b100
      - cursor/radar-alarm-signal-options-b100
      - cursor/pruefungen-swipe-order-b100
      - cursor/ar-path-screen-awake-b100
      - cursor/watcher-card-radius-b100
      - cursor/ar-path-thinner-b100
      - cursor/heading-cone-compass-b100
      - cursor/ar-path-no-flicker-b100
      - cursor/ble-device-identification-b100
      - cursor/radar-background-approval-b100
      - cursor/universal-scooter-diagnosis-b100
      - cursor/radar-map-history-b100
      - cursor/radar-ui-compact-b100
      - cursor/radar-single-menu-b100
      - cursor/radar-map-menus-compact-b100
      - cursor/ui-proportion-global-b100
      - cursor/radar-signal-settings-b100
      - cursor/auslesen-rssi-average-b100
    paths:
      - "ios/ScooterCheck/**"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Build & upload TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/ScooterCheck

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      TESTFLIGHT_CHANGELOG: "${{ github.event.inputs.changelog || 'ScooterCheck: Radar Hintergrundsuche, Display & Zulassungshinweise' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # App Store Connect requires iOS 26 SDK (Xcode 26+). Prefer newest 26.x.
          CANDIDATE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Need iOS 26 SDK or later for App Store upload (got $SDK)"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -showsdks | head -40
          xcrun simctl list runtimes || true

      - name: Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/ScooterCheck

      - name: Install gems
        run: bundle install --jobs 4

      - name: Fastlane beta
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScooterCheck-ipa
          path: ios/ScooterCheck/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14


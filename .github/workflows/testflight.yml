      - cursor/ble-find-identify-b100
      - cursor/settings-defaults-b100
      - cursor/f3pro-detect-fix-b100
      - cursor/peak-vcu24-fix-b100
      - cursor/xiaomi-scooter-6-b100
      - cursor/pedelec-auswerten-b100
      - cursor/firmware-forensics-2-b100
      - cursor/vcu-version-decode-b100
      - cursor/report-export-picker-b100
      - cursor/peak-speed-sanity-b100
      - cursor/zt3-g3-map-identify-b100
      - cursor/de-stock-22kmh-b100
      - cursor/pruefungen-swipe-delete-b100
      - cursor/clear-enc2-password-b100
      - cursor/zero-start-detect-b100
      - cursor/region-code-detect-b100
      - cursor/livecheck-prefill-b100
      - cursor/forensik-after-auslesen-b100
      - cursor/funbool-dual-source-b100
      - cursor/auslesen-stop-stay-b100
      - cursor/backend-auth-b100
      - cursor/forensik-phase1-reliability-b100
      - feature/firmware-forensics-phase2
      - cursor/plaintext-server-skip-b100
    paths:
      - "ios/ScooterCheck/**"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Build & upload TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/ScooterCheck

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      TESTFLIGHT_CHANGELOG: "${{ github.event.inputs.changelog || 'ScooterCheck: Firmware-Forensik-Pipeline (r2/Ghidra/YARA/Unicorn/angr) + KI-Anreicherung (Claude) + Stock-Diff; Backend-Auth' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # App Store Connect requires iOS 26 SDK (Xcode 26+). Prefer newest 26.x.
          CANDIDATE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Need iOS 26 SDK or later for App Store upload (got $SDK)"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -showsdks | head -40
          xcrun simctl list runtimes || true

      - name: Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/ScooterCheck

      - name: Install gems
        run: bundle install --jobs 4

      # Phase-1 Ampel/Merger/Evidence — fail before TestFlight upload on unit failures.
      - name: Unit tests (ScooterCheckTests)
        run: |
          # Prefer UDID from JSON (names like "iPhone SE (3rd generation)" break awk '()' parsing).
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 17", "iPhone 16", "iPhone 16e", "iPhone SE")
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime and "iPhone" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name") or ""
                  if "iPhone" not in name:
                      continue
                  candidates.append((name, d["udid"], runtime))
          if not candidates:
              sys.exit("no iPhone simulator available")
          for pref in preferred:
              for name, udid, runtime in candidates:
                  if name.startswith(pref):
                      print(udid)
                      print(f"Selected {name} ({runtime}) -> {udid}", file=sys.stderr)
                      raise SystemExit(0)
          name, udid, runtime = candidates[-1]
          print(udid)
          print(f"Selected {name} ({runtime}) -> {udid}", file=sys.stderr)
          ')
          echo "Using simulator UDID=$DEST"
          # Parallel clones have caused multi-minute hangs / opaque failures on
          # macos-15; keep unit tests deterministic for firmware-forensics CI.
          xcodebuild test \
            -project ScooterCheck.xcodeproj \
            -scheme ScooterCheck \
            -destination "platform=iOS Simulator,id=$DEST" \
            -only-testing:ScooterCheckTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO

      - name: Fastlane beta
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScooterCheck-ipa
          path: ios/ScooterCheck/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14


name: TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight-Changelog"
        required: false
        default: "ScooterCheck Diagnose-Build"
  push:
    branches:
      - main
      - master
      - cursor/testflight-ci-133a
      - cursor/dual-tuning-detection-133a
    paths:
      - "ios/ScootProof/**"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Build & upload TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/ScootProof

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog || 'ScooterCheck Diagnose-Build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for p in /Applications/Xcode_16*.app/Contents/Developer /Applications/Xcode.app/Contents/Developer; do
            if [ -d "$p" ]; then sudo xcode-select -s "$p"; break; fi
          done
          xcodebuild -version

      - name: Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/ScootProof

      - name: Install gems
        run: bundle install --jobs 4

      - name: Fastlane beta
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScooterCheck-ipa
          path: ios/ScootProof/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14

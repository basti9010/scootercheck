# ScooterCheck firmware-analysis → Hetzner CD
#
# Manual only (workflow_dispatch). No push-triggered deploys.
# Extends existing Phase-1 layout — does NOT invent a second architecture.
#
# GitHub Environment "production":
#   Configure required reviewers in the GitHub UI (Settings → Environments).
#   Cannot be set via API from Cloud Agents — leave as an ops checklist item.
#
# Secrets (environment "production"):
#   HETZNER_SSH_PRIVATE_KEY   deploy-user private key (prefer scootercheck-deploy, NOT root)
#   HETZNER_SSH_HOST          e.g. api.tuningscanner.de
#   HETZNER_SSH_USER          e.g. scootercheck-deploy
#   HETZNER_SSH_KNOWN_HOSTS   pinned host keys (ssh-keyscan -H …) — required
#   HETZNER_DEPLOY_PATH       optional; default /opt/scootercheck/firmware-analysis
#   HEALTH_URL                public or loopback health URL
#   SMOKE_ADMIN_TOKEN         optional; diagnostics probe only (never echoed)
#
# Gates:
#   - Immutable full 40-char commit SHA (branch tips refused)
#   - Successful "Server Firmware Tests" for that SHA (if workflow exists)
#   - iOS XCTest is intentionally NON-BLOCKING for server deploy
#   - confirm_deploy=true + Environment approval for live writes
#   - StrictHostKeyChecking=yes + known_hosts from secret (never accept-new/false)
name: Deploy Hetzner (firmware-analysis)

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Immutable full 40-char commit SHA to deploy (not a branch name)"
        required: true
        type: string
      confirm_deploy:
        description: "true = live remote writes after Environment approval; false = validate (+ optional remote dry-run)"
        required: true
        type: boolean
        default: false
      remote_dry_run:
        description: "When confirm_deploy=false, still SSH and print remote dry-run plan (needs secrets)"
        required: false
        type: boolean
        default: false
      skip_ci_gate:
        description: "Emergency only — skip server CI success check (still needs Environment approval for live)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    name: Validate SHA + CI gate
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.sha }}
      server_ci: ${{ steps.ci_gate.outputs.status }}
    steps:
      - name: Checkout repository (for rev-parse + workflow presence)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify immutable full SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "$INPUT_SHA" | tr -d '[:space:]')
          # Refuse branch names / short tips alone as deploy targets.
          if [[ ! "$RAW" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::git_sha must be a full 40-character commit SHA (got length ${#RAW}). Branch tips are refused."
            exit 1
          fi
          if ! git cat-file -e "${RAW}^{commit}" 2>/dev/null; then
            echo "::error::SHA $RAW is not a commit in this repository"
            exit 1
          fi
          FULL=$(git rev-parse --verify "${RAW}^{commit}")
          FULL=$(printf '%s' "$FULL" | tr 'A-F' 'a-f')
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "Deploy target SHA=$FULL"
          echo "### Validate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target SHA: \`$FULL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- iOS XCTest: **non-blocking** for server deploy" >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful Server Firmware Tests for SHA
        id: ci_gate
        if: ${{ inputs.skip_ci_gate != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # iOS workflow (ios-unit-tests.yml) is intentionally ignored here.
          WF=".github/workflows/server-firmware-tests.yml"
          if [[ ! -f "$WF" ]]; then
            echo "::warning::No $WF in tree — server CI gate skipped (document). Prefer adding Server Firmware Tests."
            echo "status=skipped_missing_workflow" >> "$GITHUB_OUTPUT"
            echo "- Server CI gate: skipped (workflow file absent)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Checking Server Firmware Tests for $SHA"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/server-firmware-tests.yml/runs?head_sha=${SHA}&status=completed&per_page=10" --jq '.workflow_runs')
          COUNT=$(echo "$RUNS" | jq 'length')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No completed Server Firmware Tests run for $SHA. Wait for CI, dispatch server-firmware-tests.yml, or use skip_ci_gate (emergency)."
            echo "status=missing_run" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="success")] | length')
          if [[ "$OK" -eq 0 ]]; then
            echo "::error::Server Firmware Tests did not succeed for $SHA"
            echo "$RUNS" | jq -r '.[] | "\(.id) \(.conclusion) \(.html_url)"'
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "Server CI gate OK"
          echo "- Server CI gate: success" >> "$GITHUB_STEP_SUMMARY"

      - name: CI gate skipped (emergency)
        if: ${{ inputs.skip_ci_gate == true }}
        run: |
          echo "::warning::skip_ci_gate=true — server CI gate bypassed"
          echo "status=skipped_emergency" >> "$GITHUB_OUTPUT"
          echo "- Server CI gate: SKIPPED (emergency)" >> "$GITHUB_STEP_SUMMARY"

  dry_run:
    name: Optional remote dry-run
    needs: validate
    if: ${{ inputs.confirm_deploy != true && inputs.remote_dry_run == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}
          fetch-depth: 1

      - name: Prepare SSH (known_hosts required)
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_KNOWN_HOSTS:-}" || -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" ]]; then
            echo "::error::Missing required environment secrets (HETZNER_SSH_*). See docs/HETZNER_DEPLOYMENT_SETUP.md"
            exit 1
          fi
          # Mask secret material in logs
          printf '::add-mask::%s\n' "$SSH_KEY"
          printf '::add-mask::%s\n' "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if [[ "$SSH_USER" == "root" ]]; then
            echo "::warning::HETZNER_SSH_USER=root — migrate to scootercheck-deploy (bootstrap-deploy-user.sh)"
          fi
          echo "SSH prepared for ${SSH_USER}@${SSH_HOST} (StrictHostKeyChecking=yes)"

      - name: Remote dry-run plan (no symlink flip)
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REMOTE_APP="${DEPLOY_PATH:-/opt/scootercheck/firmware-analysis}"
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          echo "[dry-run] would stage /opt/scootercheck/releases/${DEPLOY_SHA}"
          echo "[dry-run] would NOT wipe /var/lib/scootercheck"
          echo "[dry-run] would NOT overwrite /etc/scootercheck/*.env"
          echo "[dry-run] current link: ${REMOTE_APP} -> \$(readlink -f '${REMOTE_APP}' 2>/dev/null || echo '(missing)')"
          test -d /var/lib/scootercheck && echo "[dry-run] data root present"
          test -d /etc/scootercheck && echo "[dry-run] secrets root present"
          systemctl cat scootercheck-fw >/dev/null 2>&1 || sudo -n systemctl cat scootercheck-fw >/dev/null
          echo "[dry-run] systemd unit present"
          EOF
          echo "### Remote dry-run" >> "$GITHUB_STEP_SUMMARY"
          echo "SSH plan OK for \`${DEPLOY_SHA}\` — no production writes." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: SSH release deploy
    needs: validate
    if: ${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}
          fetch-depth: 1

      - name: Prepare SSH (known_hosts required)
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_KNOWN_HOSTS:-}" || -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" ]]; then
            echo "::error::Missing required environment secrets (HETZNER_SSH_*). See docs/HETZNER_DEPLOYMENT_SETUP.md"
            exit 1
          fi
          printf '::add-mask::%s\n' "$SSH_KEY"
          printf '::add-mask::%s\n' "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if [[ "$SSH_USER" == "root" ]]; then
            echo "::warning::HETZNER_SSH_USER=root — prefer scootercheck-deploy (see bootstrap-deploy-user.sh)"
          fi
          echo "SSH prepared for ${SSH_USER}@${SSH_HOST} (StrictHostKeyChecking=yes)"

      - name: Remote release deploy
        id: release
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REMOTE_APP="${DEPLOY_PATH:-/opt/scootercheck/firmware-analysis}"
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20)
          RSYNC=(rsync -az --checksum -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20")
          SRC="server/firmware-analysis/"
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p /opt/scootercheck/releases/${DEPLOY_SHA}"
          "${RSYNC[@]}" \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '*.env' \
            "$SRC" "${SSH_USER}@${SSH_HOST}:/opt/scootercheck/releases/${DEPLOY_SHA}/"
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
            "CONFIRM_PROD_DEPLOY=YES DEPLOY_SHA=${DEPLOY_SHA} REMOTE_APP=${REMOTE_APP} \
             bash /opt/scootercheck/releases/${DEPLOY_SHA}/deploy/release-deploy.sh"

      - name: Post-deploy smoke
        id: smoke
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          SMOKE_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${SMOKE_ADMIN_TOKEN:-}" ]]; then
            printf '::add-mask::%s\n' "$SMOKE_ADMIN_TOKEN"
          fi
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20)
          HU="${HEALTH_URL:-http://127.0.0.1:8088/health}"
          # Pass admin token via env on remote only for this command; do not echo.
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
            "HEALTH_URL=${HU} SMOKE_ADMIN_TOKEN=${SMOKE_ADMIN_TOKEN:-} \
             bash /opt/scootercheck/firmware-analysis/deploy/post-deploy-smoke.sh"

      - name: Rollback on smoke failure
        if: failure() && steps.release.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20)
          echo "::warning::Smoke failed — attempting automatic rollback"
          HU="${HEALTH_URL:-http://127.0.0.1:8088/health}"
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
            "CONFIRM_PROD_DEPLOY=YES HEALTH_URL=${HU} \
             bash /opt/scootercheck/firmware-analysis/deploy/release-rollback.sh"
          exit 1

      - name: Document result
        if: always()
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${{ needs.validate.outputs.deploy_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirm_deploy: true" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: production (required reviewers configured in GitHub UI)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grades: DEPLOYED only after smoke; TEA/Ghidra CONFIGURED ≠ VERIFIED; E2E=NO without Freigabe" >> "$GITHUB_STEP_SUMMARY"

  dry_run_summary:
    name: Dry-run summary
    needs: validate
    if: ${{ inputs.confirm_deploy != true && inputs.remote_dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Dry-run / validate-only" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA \`${{ needs.validate.outputs.deploy_sha }}\` validated. No remote writes." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run with \`remote_dry_run=true\` (SSH plan) or \`confirm_deploy=true\` after Environment production approval." >> "$GITHUB_STEP_SUMMARY"
          echo "iOS XCTest remains non-blocking for server deploy." >> "$GITHUB_STEP_SUMMARY"

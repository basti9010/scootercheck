# Include inside the api.tuningscanner.de HTTPS server block:
#   include /etc/nginx/snippets/scootercheck-fw.conf;

location /scootercheck-fw/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-ScooterCheck-Token $http_x_scootercheck_token;
    client_max_body_size 80m;
    # Ghidra headless can run several minutes; poll uses GET, POST returns quickly.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

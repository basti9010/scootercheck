[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scootercheck-ai-bridge"
version = "0.1.0"
description = "ScooterCheck Development Automation AI Bridge (Etappe 1–3 prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
